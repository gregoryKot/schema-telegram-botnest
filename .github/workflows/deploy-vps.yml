# Деплой на VPS (переезд с Amvera, docs/MIGRATION_VPS.md): сборка образа →
# ghcr.io → ssh на сервер → docker compose → ожидание здоровья → автооткат.
#
# ЛОГИ ЭТОГО РЕПОЗИТОРИЯ ПУБЛИЧНЫ. В выводе нет env, логов приложения и
# персональных данных: всё, что работает с секретами и сервером, печатает только
# статусы и числа (deploy/vps/ops.sh). `set -x` не использовать, .env не печатать.
#
# Пока не заданы секреты DEPLOY_HOST, DEPLOY_SSH_KEY и PROD_ENV, джоба зелёная
# и ничего не делает: мерж в main не должен краснеть до настройки сервера.
# Деплой идёт только с main и только после зелёного CI на ТОМ ЖЕ коммите
# (аудит 2026-10, quality#35): раньше `on: push` стартовал параллельно с CI, и
# красный merge-коммит успевал уехать на сервер (битая миграция = P3009-крашлуп).
# Теперь триггер — `workflow_run` на воркфлоу «CI», джоба идёт только при
# conclusion == 'success' на push в main, и всё (checkout, тег образа, релиз
# на сервере) привязано к head_sha этого прогона, а не к `github.sha`: у
# workflow_run `github.sha` — последний коммит main, а не проверенный.
# Ручной запуск (workflow_dispatch) с другой ветки отсекается if'ом, а зелёный
# CI на коммите main сверяется шагом «Актуальность коммита».
# Гейт: src/test-support/gates/deploy-needs-ci.spec.ts (push-триггер на
# воркфлоу с деплоем запрещён).
# Ruleset на main (PR + все джобы ci.yml обязательны + strict) включён
# 2026-10-22, копия — .github/rulesets/main.json. Остаток вне репозитория —
# автодеплой Amvera, решение владельца, docs/open/audit-2026-10.md.
name: Деплой на VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Идущий деплой не отменяем: обрыв посреди `compose up` хуже, чем очередь.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run: только успешный push-прогон CI на main этого же
    # репозитория (head_branch == 'main' совпадает и у PR из форка с веткой
    # main, поэтому event и head_repository проверяются отдельно).
    if: >-
      (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      # Коммит, который проверил CI (для ручного запуска — HEAD main).
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Проверка секретов
        id: gate
        env:
          HAS_PROD_ENV: ${{ secrets.PROD_ENV != '' }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          [ "$HAS_PROD_ENV" = "true" ] || missing="$missing PROD_ENV"
          if [ -n "$missing" ]; then
            echo "::notice::VPS не настроен (нет секретов:$missing), деплой пропущен"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Две защиты от «деплоя не того коммита». Ручной запуск: на коммите
      # обязан быть успешный push-прогон CI (workflow_run это гарантирует сам).
      # Оба пути: main не ушёл вперёд. Если ушёл, CI старого коммита мог
      # дозавершиться позже нового, и деплой откатил бы сервер на старое; у
      # нового коммита свой CI и свой деплой, этот выходит молча.
      - name: Актуальность коммита
        id: fresh
        if: steps.gate.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&event=push&status=success&per_page=1" --jq .total_count)
            if [ "${ok:-0}" -lt 1 ]; then
              echo "::error::На коммите ${DEPLOY_SHA:0:7} нет успешного прогона CI, деплой отменён"
              exit 1
            fi
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$DEPLOY_SHA" ]; then
            echo "::notice::main ушёл вперёд (${head:0:7}), коммит ${DEPLOY_SHA:0:7} не деплоим: у нового свой CI и свой деплой"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.fresh.outputs.go == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Имя образа
        id: image
        if: steps.fresh.outputs.go == 'true'
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.fresh.outputs.go == 'true'
        with:
          # FROM node:22-slim тянется через зеркало: Docker Hub отдавал 429 (2026-10-09).
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Вход в ghcr (сборка)
        if: steps.fresh.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Сборка и публикация образа
        if: steps.fresh.outputs.go == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.DEPLOY_SHA }}
            ${{ steps.image.outputs.name }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Настройка ssh
        if: steps.fresh.outputs.go == 'true'
        run: bash deploy/vps/ssh-setup.sh

      - name: Копирование deploy/vps на сервер
        if: steps.fresh.outputs.go == 'true'
        run: |
          ssh vps 'mkdir -p /opt/schemehappens'
          scp -q deploy/vps/* vps:/opt/schemehappens/

      - name: Запись .env из PROD_ENV
        if: steps.fresh.outputs.go == 'true'
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: printf '%s\n' "$PROD_ENV" | ssh vps 'bash /opt/schemehappens/ops.sh write-env'

      # Токен ghcr едет на stdin; на сервере он живёт во временном каталоге
      # настроек docker и стирается сразу после pull. Здоровье ждёт ops.sh
      # (до 5 минут), при провале сам откатывается на release.prev и
      # возвращает ненулевой код: джоба красная.
      - name: Деплой, ожидание здоровья, автооткат
        if: steps.fresh.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          # shellcheck disable=SC2029  # IMAGE/sha/actor подставляем на клиенте намеренно; ops.sh перепроверяет формат
          printf '%s\n' "$GH_TOKEN" | ssh vps "bash /opt/schemehappens/ops.sh deploy '$IMAGE' '$DEPLOY_SHA' '$GITHUB_ACTOR'"
