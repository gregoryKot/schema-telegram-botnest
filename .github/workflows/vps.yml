# Операции над VPS по кнопке (Actions → «Операции над VPS» → Run workflow).
# Только фиксированный набор: произвольного шелла нет, `op` разбирается через
# case с закрытым списком, а сами операции — deploy/vps/ops.sh на сервере.
#
# ЛОГИ ПУБЛИЧНЫ: операции печатают статусы, числа, sha и имена миграций; логов
# приложения здесь нет (они будут в приватном репозитории отдельным PR).
#
# Порядок переезда — docs/MIGRATION_VPS.md. Секреты те же, что у деплоя; не
# заданы — джоба зелёная с notice. Исключение — необязательный DEPLOY_USER:
# он нужен только op=grant-root (провайдеры, где root по ssh закрыт).
name: Операции над VPS

on:
  workflow_dispatch:
    inputs:
      op:
        description: Операция
        type: choice
        required: true
        options:
          - status
          - grant-root
          - bootstrap
          - transfer-open
          - transfer-check
          - restore-b2
          - external-db-check
          - transfer-close
          - release-hold
          - restart-app
          - restart-caddy
          - rollback

concurrency:
  group: vps-ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  op:
    # Запуск с чужой ветки отсекаем: bootstrap исполняет скрипт из репозитория под root.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      OP: ${{ inputs.op }}
    steps:
      - name: Проверка секретов
        id: gate
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice::VPS не настроен (нет DEPLOY_HOST или DEPLOY_SSH_KEY), операция пропущена"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.configured == 'true'

      # grant-root идёт отдельным шагом ниже: до него root по ssh закрыт, а
      # шаги «Настройка ssh» и «Копирование» рассчитаны на root.
      - name: Настройка ssh
        if: steps.gate.outputs.configured == 'true' && inputs.op != 'grant-root'
        run: bash deploy/vps/ssh-setup.sh

      # Скрипты синхронизируем перед каждой операцией: ops.sh на сервере должен
      # быть той версии, что в main.
      - name: Копирование deploy/vps на сервер
        if: steps.gate.outputs.configured == 'true' && inputs.op != 'grant-root'
        run: |
          ssh vps 'mkdir -p /opt/schemehappens'
          scp -q deploy/vps/* vps:/opt/schemehappens/

      # Разово: ключ деплоя из ~/.ssh/authorized_keys пользователя ВМ → root.
      # Скрипт идёт через stdin: в /opt под этим пользователем писать нельзя.
      # Проверка под root смотрит на uid, а не на код возврата `true`:
      # заглушка cloud-init `command="echo Please login as ..."` отвечает на
      # любую команду нулём.
      - name: Выдача root-доступа
        if: steps.gate.outputs.configured == 'true' && inputs.op == 'grant-root'
        run: |
          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::grant-root: не задан секрет DEPLOY_USER (имя пользователя ВМ, под которым пускает провайдер)"
            exit 1
          fi
          SSH_USER="$DEPLOY_USER" bash deploy/vps/ssh-setup.sh
          ssh vps 'bash -s' < deploy/vps/grant-root.sh
          SSH_USER=root bash deploy/vps/ssh-setup.sh
          [ "$(ssh vps 'id -u')" = "0" ] || { echo "::error::ssh под root не работает: ключ не принят или sshd не пускает root"; exit 1; }
          echo "root по ключу доступен"

      - name: Операция
        if: steps.gate.outputs.configured == 'true' && inputs.op != 'grant-root'
        run: |
          case "$OP" in
            bootstrap) ssh vps 'bash /opt/schemehappens/bootstrap.sh' ;;
            status|transfer-open|transfer-check|restore-b2|external-db-check|transfer-close|release-hold|restart-app|restart-caddy|rollback)
              # shellcheck disable=SC2029  # OP уже сверен со списком выше
              ssh vps "bash /opt/schemehappens/ops.sh $OP" ;;
            *) echo "::error::неизвестная операция"; exit 1 ;;
          esac
