# Недельный mutation-замер семейства src/bot. Жил вторым кроном в nightly.yml
# и ломал два наблюдателя: воскресный прогон гонял только эту джобу, её
# зелёный закрывал issue `ci-alarm` от красных будних джоб, а проба `ciRuns`
# (src/infra/self-check/probe-ci-runs.ts берёт последний прогон воркфлоу на
# main) докладывала «nightly зелёный». Один воркфлоу — одно расписание.
#
# Красный замер (просадка храповика, падение Stryker, таймаут) выносит наружу
# своя джоба alarm: issue `ci-alarm` с заголовком этого воркфлоу и DM владельцу.
name: Недельный mutation src/bot

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  mutation-bot:
    runs-on: ubuntu-26.04
    # Прогон ~3 минуты (322 мутанта, 2026-11-08); потолок — запас на рост
    # mutate и медленный раннер, а не дефолт GitHub в 360 минут.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Stryker по семейству src/bot
        run: npx stryker run stryker.bot.config.json
      - name: mutation-храповик семейства src/bot
        run: node scripts/check-mutation-ratchet.mjs --report=reports/mutation/bot.json --baseline=scripts/mutation-bot-baseline.json
      # HTML-отчёт с вкладкой Survived — что именно тесты проспали.
      - name: отчёт артефактом
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-bot-report
          path: reports/mutation/
          retention-days: 14

  # Шаги — в alarm.yml, общем с nightly.yml; у issue свой заголовок, и зелёный
  # замер закрывает только её, а не тревогу nightly.
  alarm:
    needs:
      - mutation-bot
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/alarm.yml
    with:
      needs: ${{ toJSON(needs) }}
      title: 'Недельный mutation src/bot — красный прогон'
      dm: 'Недельный замер мутаций src/bot упал'
    secrets: inherit
