# Смок живого прода (щит, волна 6): единственный наблюдатель ПОСЛЕ Amvera.
# ci.yml проверяет код и сборку ДО деплоя; nightly.yml ловит флаки тестов и
# mutation-регрессии — тоже до прода, и его browser-smoke гоняет `vite
# preview` на ЛОКАЛЬНО собранном бандле (playwright.config.ts) — Amvera там
# вообще не участвует. Деплой = push в main, Amvera тянет из GitHub сама
# (CLAUDE.md «Деплой webapp») — до этой джобы ни одна не спрашивала «а
# реально ли открылся сайт у живого пользователя»: протухший деплой на
# стороне хостинга, упавший контейнер, битый DNS/сертификат видны только
# людям, которые случайно зашли и написали.
#
# НЕ покрыто (и не может быть): вход через мессенджер-webview. Настоящую
# подпись initData Telegram/MAX в CI не воспроизвести — см. docs/SECURITY.md
# и docs/archive/INCIDENT_2026-08-08_TELEGRAM_LOGIN.md (тот сбой был именно
# в мосте мессенджера и держится отдельным клиентским отчётом об ошибке
# входа, не этим смоком). Здесь проверяется только то, что сервер жив,
# отдаёт сайт и раздаёт актуальный бандл мини-аппа статикой.
name: Смок живого прода

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # ВАЖНО: несущая проверка здесь — grep по маркеру, а НЕ `--fail`.
      # Сервер отдаёт SPA-фолбэк: любой неизвестный путь возвращает 200 с
      # index.html сайта (проверено: /health-nope → 200 + HTML). Значит по
      # коду ответа сломанный прод неотличим от живого, и `--fail` поймает
      # только полный отказ хоста. Если «упростить» шаги, выкинув grep,
      # смок станет зелёным на наглухо сломанном приложении.
      # Маркеры различают: в фолбэк-HTML сайта нет `/app/assets/index.js`,
      # поэтому непоехавший мини-апп уронит шаг /app/.
      # --fail: 4xx/5xx не глотается как «успех», шаг падает громко.
      # --retry 2 — только сетевой дребезг между раннером GitHub и прод-хостом
      # (couple of retries), НЕ цикл: после двух неудач curl возвращает
      # ошибку и шаг красный — настоящий даунтайм не тонет в повторах.
      CURL: curl --fail --silent --show-error --max-time 10 --retry 2 --retry-delay 3
    steps:
      - name: /health — 200 и db":"up"
        run: |
          body=$($CURL https://schemehappens.ru/health)
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          echo "$body" | grep -q '"db":"up"'
      - name: / — 200 и похоже на сайт (стабильный маркер, не весь HTML)
        run: |
          body=$($CURL https://schemehappens.ru/)
          echo "$body" | grep -q 'Григорий Котляревский'
      - name: /app/ — 200 и реально раздаёт бандл мини-аппа
        run: |
          body=$($CURL https://schemehappens.ru/app/)
          # Имя ассета мини-аппа намеренно без контент-хеша (щит, волна 1,
          # CLAUDE.md п.13 «Имена ассетов мини-аппа — без контент-хеша») —
          # маркер стабилен между деплоями, не ловит false negative на
          # каждой пересборке.
          echo "$body" | grep -q '/app/assets/index.js'
