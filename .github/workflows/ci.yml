# CI-гейт (правило №1 CLAUDE.md: ничего не мержится с красным CI).
# Бэкенд: типы + юнит-тесты + coverage-храповик. Фронтенды: сборка (ловит
# TS-ошибки). eslint — храповиком (правило №9): исторический долг
# зафиксирован в scripts/eslint-baseline.json, рост счётчика роняет джобу
# eslint. Покрытие бэкенда — храповиком в scripts/coverage-baseline.json
# (TEST_COVERAGE_PLAN.md, этап 4, п.14).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Ручной запуск на любой ветке: пуши агента через интеграцию не триггерят
  # pull_request-раны, а правило 1а требует зелёный CI перед мержем — агент
  # запускает воркфлоу сам (gh/API workflow_dispatch) и ждёт результата.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Диагностика зависаний 2026-07-20 (шаг coverage висел бесконечно на
    # раннере, локально не воспроизводится): таймаут вместо вечного
    # in_progress — убитый шаг отдаёт лог с последней строкой вывода,
    # вечная джоба не отдаёт ничего и жрёт слот раннера 6 часов.
    timeout-minutes: 15
    env:
      # ts-jest транспилирует src в JS на каждый прогон jest; кэш переживает
      # джобу через actions/cache ниже — прокидывается явным --cacheDirectory
      # в каждый npx jest, потому что jest не читает env-переменную для этого
      # (в конфиге кэш-путь не задан, а package.json трогать нельзя — CI-4.2).
      JEST_CACHE_DIR: .jest-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Кэш ts-jest между прогонами CI (CI-гигиена 4.2): ключ по
      # package-lock.json — если зависимости (в т.ч. ts-jest/typescript)
      # не менялись, кэш переиспользуется; иначе restore-keys подхватывают
      # ближайший старый кэш вместо холодного старта.
      - name: Кэш ts-jest
        uses: actions/cache@v4
        with:
          path: ${{ env.JEST_CACHE_DIR }}
          key: jest-ts-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            jest-ts-cache-${{ runner.os }}-
      - run: npx tsc --noEmit -p tsconfig.build.json
      # coverage-храповик (TEST_COVERAGE_PLAN.md, этап 4, п.14): сам гоняет
      # jest --coverage, отдельный `npx jest` не нужен. Падает при просадке
      # покрытия ниже scripts/coverage-baseline.json (общей или по полу
      # src/auth и src/utils). Читает JEST_CACHE_DIR из env и прокидывает
      # его spawn'нутому jest как --cacheDirectory.
      - run: node scripts/check-coverage-ratchet.mjs
        timeout-minutes: 6
      # Тот же пакет тестов под НЕ-UTC зоной (инцидент 2026-07-20), второй
      # полный прогон после coverage-храповика выше. Раннер всегда UTC,
      # поэтому баги «время считается от зоны сервера» в CI невидимы:
      # парсер TZID в caldav-busy.ts был сломан для любой не-UTC машины, но
      # CI был зелёный, а разработчик в Asia/Jerusalem ловил два красных
      # теста и искал причину в своём окружении.
      # Sydney выбран намеренно: ненулевое смещение + DST в противофазе к
      # северному полушарию. Мутировать process.env.TZ внутри jest нельзя —
      # песочница не пробрасывает смену зоны в V8, только env процесса.
      # Прогон стоит ~20 секунд.
      - name: jest под не-UTC таймзоной — ловит зависимость от зоны сервера
        run: npx jest --cacheDirectory="$JEST_CACHE_DIR"
        env:
          TZ: Australia/Sydney
      # e2e-смоук (TEST_COVERAGE_PLAN.md, этап 1 п.7): реальный AppModule
      # целиком (ValidationPipe, гарды, фильтры), только PrismaService и
      # TELEGRAF_BOT подменены фейками — ловит то, что юнит-тесты не могут:
      # гард не примонтирован, DTO-пайп не применён глобально, утечку чужих
      # данных через HTTP. См. test/app-auth.e2e-spec.ts, test/app-ownership.e2e-spec.ts.
      # read-after-write.e2e-spec гоняется отдельно в джобе migrations (нужен
      # реальный Postgres) — здесь исключён, наши специи на фейк-Prisma.
      - run: >-
          npx jest --config ./test/jest-e2e.json --cacheDirectory="$JEST_CACHE_DIR"
          test/app-auth test/app-ownership test/app-ownership-sweep
          test/auth-flows test/public-quizzes
      # Security-гейт (этап 1.4): high/critical уязвимости в prod-зависимостях
      # блокируют мерж. dev-зависимости не гейтим — шум.
      - run: npm audit --omit=dev --audit-level=high
      # Храповик копипасты: новая дублированная логика ≥70 токенов не проходит.
      # Требует npx jscpd из node_modules — не fs-only, остаётся здесь
      # (в отличие от route-collisions/legacy-name, см. джобу checks).
      - run: node scripts/check-jscpd-ratchet.mjs
      # Храповик размера файлов (правило №10): файл из бейслайна только
      # уменьшается, новый файл >300 строк не проходит. Долг тает, не растёт.
      - run: node scripts/check-file-size-ratchet.mjs
      # Храповик слабых тестов (TEST_IMPROVEMENT_PLAN.md, этап 3.1): expect(),
      # состоящий только из голых .toHaveBeenCalled()/.toHaveBeenCalledTimes(n)
      # без проверки аргументов, зелёный даже если хендлер шлёт мусор — новых
      # таких тестов быть не должно, исторический долг зафиксирован в бейслайне.
      - run: node scripts/check-weak-assert-ratchet.mjs
      # Храповик роботных конструкций (свип 2026-07, docs/VOICE.md): правила
      # голоса касались только статей, а «это не X, это Y», канцелярит и
      # слова-филлеры расползлись по всему user-facing тексту. Счётчик
      # пофайловый и может только падать.
      - run: node scripts/check-robot-phrases.mjs

  # Лёгкие fs-only проверки (CI-гигиена 4.2): читают исходники через
  # node:fs/node:path, без единой npm-зависимости — не нуждаются в npm ci
  # и node_modules. Вынесены из backend-джобы, чтобы не ждать полную
  # установку зависимостей ради двух быстрых проверок по grep-принципу.
  # check-address-form.mjs и check-paired-files.mjs НЕ трогаем — они уже
  # живут в джобе webapp.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Один маршрут — один контроллер (аудит: найдены живые дубли маршрутов
      # с разъехавшейся privacy-логикой).
      - run: node scripts/check-route-collisions.mjs
      # Старое имя продукта «СхемаЛаб»/«Схема-лаб» не возвращается (переехали
      # на «Всё по схеме»); первый проход искал только латиницей и кириллицу
      # упустил.
      - run: node scripts/check-legacy-name.mjs

  # Миграции гоняются на РЕАЛЬНОМ Postgres (инцидент 2026-07-16: битый сид
  # healthy_adult_phrases — updatedAt NOT NULL без значения — уронил прод
  # в крашлуп; ни один существующий чек SQL не исполнял). Правило CLAUDE.md
  # «Миграции БД»: рукописный SQL не мержится, пока не прошёл migrate deploy.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: migrate deploy на пустой БД — ловит битые миграции до прода
        run: npx prisma migrate deploy
      - name: повторный migrate deploy — все миграции зарегистрированы, состояние чистое
        run: npx prisma migrate deploy
      # Джоба проверяла только что SQL исполняется, но не что миграции дают ту
      # же БД, что объявлена в schema.prisma. Из-за этого дрейф копился
      # незаметно: 4 индекса были в схеме, но их не создавала ни одна миграция —
      # на проде их просто не было, запросы шли последовательным сканом.
      # --exit-code: 0 = дифф пуст, 2 = есть расхождение → джоба падает.
      - name: schema.prisma == миграции — дрейф роняет PR, а не копится годами
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npx prisma generate
      # E2E read-after-write smoke на реальном Postgres (best-practice 2026-07):
      # сохранил карточку → читается обратно + попала в денормализованный
      # профиль. Только этот спек (app.e2e-spec поднимает весь AppModule и
      # требует полного env — здесь не нужен). --runInBand: одна БД, без гонок.
      - name: e2e read-after-write smoke
        run: npx jest --config ./test/jest-e2e.json --runInBand test/read-after-write.e2e-spec.ts
      # Ownership-спеки ВТОРЫМ прогоном на реальном Postgres (TEST_TRUST_PLAN.md,
      # п.1): в джобе `backend` те же файлы гоняются на самописном fake-prisma
      # (test/e2e-support/fake-prisma.ts) — он трижды расходился с настоящей
      # Prisma на ЗЕЛЁНЫХ тестах (не понимал top-level OR → disconnect удалял
      # 0 строк, не применял @default из схемы → invite/join молча отбивался,
      # не поддерживал include → связь TherapyRelation→User была undefined).
      # Расхождение фейка с реальностью теперь падает здесь, а не живёт
      # годами незамеченным. E2E_REAL_DB=1 переключает buildTestApp() на
      # настоящий PrismaService (build-test-app.ts) вместо фейка.
      # --runInBand: одна БД, спеки чистят свои userId сами (cleanup-fixtures.ts).
      - name: e2e ownership smoke на реальном Postgres (фейк vs реальность)
        run: >-
          npx jest --config ./test/jest-e2e.json --runInBand
          test/app-ownership.e2e-spec.ts test/app-ownership-sweep.e2e-spec.ts
          test/app-ownership-sweep-2.e2e-spec.ts test/app-ownership-sweep-3.e2e-spec.ts
          test/therapy-ownership.e2e-spec.ts test/therapy-ownership-2.e2e-spec.ts
        env:
          E2E_REAL_DB: '1'

  webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci --prefix webapp
      - run: npm run build --prefix webapp
      # Фронтенд-coverage-храповик (TEST_IMPROVEMENT_PLAN.md, этап 2.1; по
      # образцу scripts/check-coverage-ratchet.mjs бэкенда): сам гоняет
      # `vitest run --coverage` и падает при просадке покрытия ниже
      # scripts/frontend-coverage-baseline.json. Раньше coverage тут вообще
      # не гейтился — джоба просто гоняла `npm test`.
      - run: node scripts/check-frontend-coverage-ratchet.mjs --package webapp
      # ты/вы-храповик (правило CLAUDE.md): новые жёсткие «ты»-строки без tr()
      # не проходят; исторический долг зафиксирован в бейслайне.
      - run: node scripts/check-address-form.mjs
      # Согласование «вы» (свип голоса 2026-07): храповик выше ищет остаточные
      # «ты»-местоимения и слеп к паре «вы» + единственное число — «вы дал»,
      # «вы благодарен», «вы вырос». Сплошная вычитка нашла 11 таких мест;
      # проверка жёсткая, без бейслайна — новых быть не должно.
      - run: node scripts/check-address-agreement.mjs
      # Драйв-гард парных файлов (правило №3): канонические пары
      # webapp ↔ miniapp обязаны быть побайтово идентичны.
      - run: node scripts/check-paired-files.mjs

  # shared/ — общий пакет двух фронтендов (этап 2.2 TEST_IMPROVEMENT_PLAN.md):
  # до этой джобы 3431 строка shared-кода тестировалась только транзитивно
  # через тесты webapp/miniapp — свои тесты и свой coverage-храповик не
  # существовали. Джоба гоняет vitest пакета через тот же
  # check-frontend-coverage-ratchet.mjs (--package shared).
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - run: npm ci --prefix shared
      - run: node scripts/check-frontend-coverage-ratchet.mjs --package shared

  # eslint-храповик (этап 2е, правило №9). Нужны node_modules всех трёх
  # пакетов + prisma generate: typed-линт без типов зависимостей видит
  # everything-as-any и счётчики уезжают. game/ исключён (заморожен).
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json
            schema-miniapp/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm ci --prefix webapp
      - run: npm ci --prefix schema-miniapp
      - run: node scripts/check-eslint-ratchet.mjs

  miniapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: schema-miniapp/package-lock.json
      - run: npm ci --prefix schema-miniapp
      # build мини-аппа — голый `vite build` (без tsc, чтобы пересборка dist
      # оставалась быстрой). Типы гоняем отдельным шагом через
      # tsconfig.typecheck.json — иначе TS-ошибки в исходнике мини-аппа
      # доезжают до прода (webapp имеет гейт через `tsc -b`).
      - run: npm run typecheck --prefix schema-miniapp
      - run: npm run build --prefix schema-miniapp
      # Фронтенд-coverage-храповик (TEST_IMPROVEMENT_PLAN.md, этап 2.1) —
      # см. комментарий в джобе webapp; здесь гоняет только свой пакет.
      - run: node scripts/check-frontend-coverage-ratchet.mjs --package schema-miniapp
      # dist коммитится в git (Docker его только копирует) — проверяем,
      # что закоммиченный dist не разошёлся с исходником.
      - name: dist актуален
        run: |
          if [ -n "$(git status --porcelain schema-miniapp/dist)" ]; then
            echo '::error::schema-miniapp/dist устарел — пересобери: npm run build --prefix schema-miniapp и закоммить dist'
            git status --short schema-miniapp/dist
            exit 1
          fi
