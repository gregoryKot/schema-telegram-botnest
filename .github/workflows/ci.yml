# CI-гейт (правило №1 CLAUDE.md: ничего не мержится с красным CI).
# Бэкенд: типы + юнит-тесты + coverage-храповик. Фронтенды: сборка (ловит
# TS-ошибки). eslint — храповиком (правило №9): исторический долг
# зафиксирован в scripts/eslint-baseline.json, рост счётчика роняет джобу
# eslint. Покрытие бэкенда — храповиком в scripts/coverage-baseline.json
# (TEST_COVERAGE_PLAN.md, этап 4, п.14).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Ручной запуск на любой ветке: пуши агента через интеграцию не триггерят
  # pull_request-раны, а правило 1а требует зелёный CI перед мержем — агент
  # запускает воркфлоу сам (gh/API workflow_dispatch) и ждёт результата.
  workflow_dispatch:

# Новый пуш в PR отменяет устаревший прогон того же PR (2026-10-16: из 12
# прогонов в очереди раннеров 4 были для уже заменённых коммитов). Прогон
# main отменять нельзя — каждый коммит main это деплой. Поэтому вне PR группа
# своя у каждого прогона (run_id): с общей группой на ветку GitHub держит один
# идущий и один ожидающий прогон, а следующий ожидающий молча сбрасывает.
# Гейт: src/test-support/gates/ci-concurrency.spec.ts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Токен раннера по умолчанию — только чтение (аудит 2026-10, I5): ни одной
# джобе ниже не нужна запись в репозиторий/PR/issues. Нужна запись — выдавай
# её на уровне конкретной джобы (`permissions:` внутри job), а не здесь.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    # Диагностика зависаний 2026-07-20 (шаг coverage висел бесконечно на
    # раннере, локально не воспроизводится): таймаут вместо вечного
    # in_progress — убитый шаг отдаёт лог с последней строкой вывода,
    # вечная джоба не отдаёт ничего и жрёт слот раннера 6 часов.
    timeout-minutes: 15
    env:
      # ts-jest транспилирует src в JS на каждый прогон jest; кэш переживает
      # джобу через actions/cache ниже — прокидывается явным --cacheDirectory
      # в каждый npx jest, потому что jest не читает env-переменную для этого
      # (в конфиге кэш-путь не задан, а package.json трогать нельзя — CI-4.2).
      JEST_CACHE_DIR: .jest-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Кэш ts-jest между прогонами CI (CI-гигиена 4.2): ключ по
      # package-lock.json — если зависимости (в т.ч. ts-jest/typescript)
      # не менялись, кэш переиспользуется; иначе restore-keys подхватывают
      # ближайший старый кэш вместо холодного старта.
      - name: Кэш ts-jest
        uses: actions/cache@v6
        with:
          path: ${{ env.JEST_CACHE_DIR }}
          key: jest-ts-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            jest-ts-cache-${{ runner.os }}-
      - run: npx tsc --noEmit -p tsconfig.build.json
      # coverage-храповик (TEST_COVERAGE_PLAN.md, этап 4, п.14): сам гоняет
      # jest --coverage, отдельный `npx jest` не нужен. Падает при просадке
      # покрытия ниже scripts/coverage-baseline.json (общей или по полу
      # src/auth и src/utils). Читает JEST_CACHE_DIR из env и прокидывает
      # его spawn'нутому jest как --cacheDirectory.
      - run: node scripts/check-coverage-ratchet.mjs
        timeout-minutes: 6
      # Тот же пакет тестов под НЕ-UTC зоной (инцидент 2026-07-20), второй
      # полный прогон после coverage-храповика выше. Раннер всегда UTC,
      # поэтому баги «время считается от зоны сервера» в CI невидимы:
      # парсер TZID в caldav-busy.ts был сломан для любой не-UTC машины, но
      # CI был зелёный, а разработчик в Asia/Jerusalem ловил два красных
      # теста и искал причину в своём окружении.
      # Sydney выбран намеренно: ненулевое смещение + DST в противофазе к
      # северному полушарию. Мутировать process.env.TZ внутри jest нельзя —
      # песочница не пробрасывает смену зоны в V8, только env процесса.
      # Прогон стоит ~20 секунд.
      - name: jest под не-UTC таймзоной — ловит зависимость от зоны сервера
        run: npx jest --cacheDirectory="$JEST_CACHE_DIR"
        env:
          TZ: Australia/Sydney
      # e2e-смоук (TEST_COVERAGE_PLAN.md, этап 1 п.7): реальный AppModule
      # целиком (ValidationPipe, гарды, фильтры), только PrismaService и
      # TELEGRAF_BOT подменены фейками — ловит то, что юнит-тесты не могут:
      # гард не примонтирован, DTO-пайп не применён глобально, утечку чужих
      # данных через HTTP. См. test/app-auth.e2e-spec.ts, test/app-ownership.e2e-spec.ts.
      # read-after-write.e2e-spec гоняется отдельно в джобе migrations (нужен
      # реальный Postgres) — здесь исключён, наши специи на фейк-Prisma.
      - run: >-
          npx jest --config ./test/jest-e2e.json --cacheDirectory="$JEST_CACHE_DIR"
          test/app-auth test/app-ownership test/app-ownership-sweep
          test/auth-flows test/public-quizzes test/phrase-check-ownership
          test/scheduler-teardown test/login-ticket test/refresh-rotation
          test/slot-override test/therapy-remove-client test/therapy-resign test/therapy-invite
          test/body-limit test/login-csrf test/payment-webhook-practice-host
          test/text-limits test/therapy-ownership.e2e-spec.ts
          test/booking-admin-cancel test/exercise-delete-ownership test/max-auth
          test/diary-mode-from-case
          test/therapy-task-delete
      # Security-гейт (этап 1.4): high/critical уязвимости в prod-зависимостях
      # блокируют мерж. dev-зависимости не гейтим: сборочная цепочка
      # исполняется на раннере, а не у пользователя, её несёт Dependabot.
      # У КАЖДОГО package-lock.json свой шаг (аудит 2026-10: до этого гейт
      # смотрел только корень, фронт проверял лишь аудитор глазами). Сверка
      # «lock-файл ↔ шаг» — src/test-support/gates/lockfile-audit.spec.ts.
      # npm audit читает lock-файл, node_modules пакету не нужны.
      # Через обёртку scripts/npm-audit.mjs (регресс #814: голый audit висел на
      # реестре до таймаута шага): попытка ≤45 с, до трёх попыток с паузой
      # 10 с — худший случай 2 мин 41 с (с 2 с на добивание группы), отсюда timeout-minutes: 4. Уязвимость
      # краснеет сразу, «реестр не ответил» — отдельным ::error::.
      - name: npm audit — корень
        timeout-minutes: 4
        run: node scripts/npm-audit.mjs .
      # Игра своей джобы не имеет, а в прод-образ собирается (Dockerfile).
      - name: npm audit — game
        timeout-minutes: 4
        run: node scripts/npm-audit.mjs game
      # Храповик копипасты: новая дублированная логика ≥70 токенов не проходит.
      # Требует npx jscpd из node_modules — не fs-only, остаётся здесь
      # (в отличие от route-collisions/legacy-name, см. джобу checks).
      - run: node scripts/check-jscpd-ratchet.mjs
      # Храповик размера файлов (правило №10): файл из бейслайна только
      # уменьшается, новый файл >300 строк не проходит. Долг тает, не растёт.
      - run: node scripts/check-file-size-ratchet.mjs
      # Храповик слабых тестов (TEST_IMPROVEMENT_PLAN.md, этап 3.1): expect(),
      # состоящий только из голых .toHaveBeenCalled()/.toHaveBeenCalledTimes(n)
      # без проверки аргументов, зелёный даже если хендлер шлёт мусор — новых
      # таких тестов быть не должно, исторический долг зафиксирован в бейслайне.
      - run: node scripts/check-weak-assert-ratchet.mjs
      # Храповик роботных конструкций (свип 2026-07, docs/VOICE.md): правила
      # голоса касались только статей, а «это не X, это Y», канцелярит и
      # слова-филлеры расползлись по всему user-facing тексту. Счётчик
      # пофайловый и может только падать.
      - run: node scripts/check-robot-phrases.mjs
      # Храповик мужского рода (свип 2026-08): продукт говорит на «ты», а в
      # прошедшем времени и кратких прилагательных русский род не прячет —
      # «ты сделал», «ты не обязан», «позволь себе быть сильным». Для половины
      # читателей это звучало как написанное не им. Форма «вы» защищена сама
      # (множественное число рода не имеет), «ты» — нет, и она по умолчанию.
      - run: node scripts/check-gendered-forms.mjs
      # Храповик тихих catch (три волны ужесточения тестов, 2026-08): девять
      # проды-багов имели одну форму — `.catch(() => {})` (или `=> []` / `=>
      # null`) глушит ошибку сети, а код после него ведёт себя так, будто
      # запрос удался («✓ Сохранено» на упавшем запросе, список задач молча
      # схлопывается в пустой). tsc и coverage это не ловят — только гейт.
      - run: node scripts/check-silent-catch.mjs

  # Лёгкие fs-only проверки (CI-гигиена 4.2): читают исходники через
  # node:fs/node:path, без единой npm-зависимости — не нуждаются в npm ci
  # и node_modules. Вынесены из backend-джобы, чтобы не ждать полную
  # установку зависимостей ради двух быстрых проверок по grep-принципу.
  # check-address-form.mjs и check-paired-files.mjs НЕ трогаем — они уже
  # живут в джобе webapp.
  checks:
    runs-on: ubuntu-24.04
    # Потолок на джобу — страховка от зависшего шага (правило №24): без него
    # GitHub держит джобу до 360 минут. Значения — примерно втрое от замера
    # (пять зелёных прогонов main 2026-10-15). Гейт — job-timeouts.spec.ts.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Один маршрут — один контроллер (аудит: найдены живые дубли маршрутов
      # с разъехавшейся privacy-логикой).
      - run: node scripts/check-route-collisions.mjs
      # Правило №6 CLAUDE.md: новый эндпоинт = DTO с class-validator.
      # ValidationPipe({ whitelist: true }) валидирует тело запроса рефлексией
      # класса — у `@Body() dto: SomeInterface`/`Record<...>` этой рефлексии в
      # рантайме нет, и Nest молча пропускает тело без единой проверки. Найдено
      # 8 таких мест, включая два публичных денежных эндпоинта —
      # `POST /api/donation` и `POST /api/subscription`. Сами суммы там
      # защищены (донат клампится, цену подписки берёт сервер), а форма тела
      # не проверяется: нестроковый email ловит TypeError на .trim() и отдаёт
      # 500 вместо 400. Причина по каждому исключению — в бейслайне.
      - run: node scripts/check-body-dto.mjs
      # Контроллер не режет поля запроса молча (находка аудита 2026-10-11,
      # backend#29): заметка терапевта на 6000 знаков при DTO на 10 000
      # отвечала 201 и теряла хвост из-за `slice(0, 5000)` в контроллере.
      # Лимит один и стоит в DTO — превышение даёт 400. Исключения (дата из
      # ISO-момента) — в scripts/body-truncation-baseline.json с причиной.
      - run: node scripts/check-body-truncation.mjs
      # У строкового поля DTO есть верхняя граница (находка аудита 2026-10-11):
      # `VirtualClientDto.name` был одним `@IsString()`, тело принимается до
      # 256 КБ — имя на четверть мегабайта ложилось в БД и в каждый ответ
      # `GET /clients`. check-body-dto.mjs смотрит, что у @Body() стоит класс,
      # а не что внутри класса. Исключения (формат проверяется позже, honeypot,
      # админские тексты) — в scripts/dto-string-bounds-baseline.json с причиной.
      - run: node scripts/check-dto-string-bounds.mjs
      # Старое имя продукта «СхемаЛаб»/«Схема-лаб» не возвращается (переехали
      # на «Всё по схеме»); первый проход искал только латиницей и кириллицу
      # упустил.
      - run: node scripts/check-legacy-name.mjs
      # Мёртвые файлы: у каждого исходника должен быть потребитель в прод-коде.
      # Найдено этим гейтом: вторая копия prisma-exception.filter (правки в неё
      # не доезжали до прода) и два неподключённых компонента мини-аппа.
      - run: node scripts/check-dead-files.mjs
      # Паритет фич между фронтендами (правило №3, расследование 2026-08-21):
      # check-paired-files.mjs (джоба webapp) видит только файлы из жёсткого
      # списка PAIRS — файл, которого в списке нет, гейт не видит вообще, и
      # PhraseCheck-упражнение/DiaryShareButton/.ics-экспорт жили только в
      # мини-аппе незамеченными. check-dead-files.mjs выше считает единицей
      # учёта ФАЙЛ — живой api.ts прикрывает собой мёртвый метод внутри
      # (deleteBeliefCheck/deleteFlashcard/deleteLetter объявлены в обоих
      # фронтендах и не вызываются НИОТКУДА, кроме тестов). Источник истины —
      # роуты бэкенда (src/api/**/*.controller.ts, общие для обеих площадок):
      # гейт проверяет, что каждый роут реально доступен с обеих площадок или
      # осознанно заведён в scripts/feature-parity-baseline.json с причиной.
      - run: node scripts/check-feature-parity.mjs
      # Leader-election кронов: крон без него дублируется на втором инстансе
      # (второй под, перекатывающийся деплой Amvera) — два процесса шлют одно и
      # то же сообщение дважды. Гейт не ищет признак «похоже на безопасное», а
      # требует явной классификации каждого `@Cron(` в
      # scripts/cron-leader-baseline.json (leader — claimRun( обязателен в
      # теле, exempt — только с внятной причиной); протухшая запись тоже красит
      # CI. Флага --update нет: это решение человека, не счётчик долга.
      - run: node scripts/check-cron-leader.mjs
      # Счётчик попыток в памяти процесса обнуляется деплоем и не общий между
      # инстансами (правило №5). Каждая ручка с лимитом или с проверкой кода /
      # заявкой несёт @PersistentThrottle (счёт в Postgres) либо запись exempt с
      # причиной в scripts/persistent-throttle-baseline.json. Флага --update нет.
      - run: node scripts/check-persistent-throttle.mjs
      - run: node scripts/check-raw-sql-live.mjs
      # Каждый test/**/*.e2e-spec.ts гоняется хотя бы одним шагом jest-e2e
      # (аудит 2026-10-11: два спека лежали в test/ без единого прогона), и
      # наоборот: путь в CI без файла — переименованный спек, который jest
      # молча пропускает. Бейслайна нет, флага --update нет.
      - run: node scripts/check-e2e-in-ci.mjs
      # Документы для агентов не врут: CLAUDE.md в бюджете (он грузится в каждую
      # сессию), у правил .claude/rules есть paths, карта кода называет все
      # каталоги и гейты, пути и ссылки живы. Бейслайна и --update нет.
      - run: node scripts/check-agent-docs.mjs
      # Файл, выделенный из файла мутационной зоны, не выпадает из `mutate`
      # молча (nightly golden-auth, #614: redact() ушёл из security-log.service
      # в security-log-redact.ts и перестал измеряться). Классификация в
      # scripts/mutation-zone-baseline.json; флага --update нет.
      - run: node scripts/check-mutation-zone.mjs
      # Браузерный код вне src/ (public/*.js, инлайн-скрипты index.html) обязан
      # быть под тестом. Инцидент 2026-08-08: загрузчик моста MAX ловил чужой
      # параметр `tgWebAppData` подстрокой и ломал вход ВСЕМ пользователям
      # Telegram — файл никто не импортирует, поэтому его не видели ни
      # coverage, ни гейт мёртвых файлов, ни один тест.
      - run: node scripts/check-public-scripts.mjs
      # Пул канала «Здоровый Взрослый»: живая БД (миграции) обязана совпадать
      # с фолбэком src/bot/healthy-adult.data.ts. Инцидент (аудит 2026-08):
      # дегендерный свип поправил только фолбэк — синхронизирующей миграции
      # не было, подписчики канала получали фразы с мужским родом ещё
      # несколько недель, потому что публикация идёт из БД, а не из фолбэка.
      - run: node scripts/check-pool-sync.mjs
      # Терминология схема-терапии сверена с docs/TERMINOLOGY.md (МИСТ):
      # владелец нашёл «схема Неудача» в статье вместо канонического
      # «Неуспешность» — правило без гейта уже возвращалось. Абсолютный
      # запрет, без бейслайна (класс размётся полностью прямо сейчас).
      - run: node scripts/check-schema-terms.mjs
      # merge-драйверы (.gitattributes ↔ scripts/setup-merge-drivers.mjs):
      # атрибут без драйвера молча деградирует до текстового слияния, то есть
      # защита от конфликтов между параллельными агентами есть на бумаге и нет
      # на деле. Сверка ловит рассинхрон.
      - run: node scripts/setup-merge-drivers.mjs --check
      # Исполняемый код вне наблюдаемых деревьев (тот же класс, что уронил
      # инцидент 2026-08-08 — webapp/public/max-bridge.js ломал вход всем
      # пользователям Telegram 5 суток, потому что его не видел ни один
      # инструмент). check-dead-files.mjs и check-public-scripts.mjs выше
      # смотрят только на конкретные деревья/расширения — гейт нашёл дыру
      # СОСЕДОМ с ними: `deploy/threads-relay/worker.js` (Cloudflare Worker,
      # реально работает в проде, содержит сверку секрета `x-relay-key` —
      # AUTH-путь) не видел ни один из них. Тест-лекарство —
      # src/infra/threads-relay-worker.spec.ts.
      - run: node scripts/check-unwatched-code.mjs
      # Троттлинг сигнализации живёт в КАНАЛЕ ДОСТАВКИ, а не у вызывающего
      # (инцидент 2026-07-29: шквал одинаковых DM «suspicious_initdata»
      # замьютил чат админу — фикс завели точечно, и он не защитил соседние
      # вызовы того же notifyAdminWithFallback: `csrf_blocked`
      # (auth-http.util.ts) слал DM вообще без троттлинга — регрессия
      # cookie/SameSite после деплоя ломает CSRF для КАЖДОЙ авторизованной
      # записи КАЖДОГО пользователя разом, то есть DM на каждый запрос).
      # Теперь бюджет (K=3 за 15 минут на имя события) встроен в
      # SecurityLogService — единственный канал DM для событий безопасности —
      # и новому call site не нужно об этом помнить.
      - run: node scripts/check-alert-throttle.mjs
      # Деплой-шов (правило №14 CLAUDE.md): Dockerfile/.dockerignore/amvera.yml
      # не читает ни tsc, ни jest, ни eslint — они не .ts/.js. Гейт статически
      # проверяет, что то, что Dockerfile копирует (COPY/`cp -r`), существует
      # в репозитории или производится сборкой, что назначение мини-аппа
      # совпадает с rootPath ServeStaticModule в src/app.module.ts, что
      # .dockerignore не исключает то, что COPY тут же копирует, и что
      # amvera.yml согласован с deploy/entrypoint.mjs. Это ловит рассинхрон
      # ПУТЕЙ за миллисекунды, но не докажет, что образ вообще собирается —
      # синтаксис Dockerfile, версии пакетов, реестр — за это отвечает джоба
      # `docker` ниже (щит, волна 6): раньше этот класс дефекта красил только
      # сборку на Amvera, уже после мержа, перед живыми пользователями.
      - run: node scripts/check-deploy-paths.mjs
      # Щит, волна 8: «ветка, зависящая от конфигурации, деградирует МОЛЧА».
      # Заголовный случай — src/utils/admin-alert.ts: без BOT_TOKEN/ADMIN_ID
      # и без RESEND_API_KEY/ADMIN_EMAIL КАЖДЫЙ алерт (события безопасности,
      # сбои платежей, сбои канала волн 2/3/7) улетает в никуда без следа —
      # позвоночник всех рантайм-наблюдателей щита молча отключается одной
      # пропущенной env-переменной. Гейт ищет форму `if (!token/key/secret/
      # process.env.X) return …` без throw; найденное либо в
      # src/infra/capability-report.ts (видно в /stats и в логе старта), либо
      # в бейслайне с причиной.
      - run: node scripts/check-capability-registry.mjs
      # Реестр env-переменных (щит, инциденты 2026-09-15/16: пустой
      # ADMIN_EMAIL молчал; GOOGLE_REDIRECT_URI указывал на хост, который
      # сервер сам редиректит дальше — вход зацикливался). Дополняет гейт
      # выше: тот про «переменной НЕТ — фича молча выключена», этот — про
      # «переменная ЕСТЬ, но неверна» (опечатка, чужой хост, пустая строка).
      # Каждое чтение process.env.X/config.get('X') в src/** обязано
      # ссылаться на запись src/infra/env-registry.entries*.ts, и каждая
      # запись обязана реально читаться — иначе протухла. Классификация, не
      # счётчик долга: флага --update нет.
      - run: node scripts/check-env-registry.mjs
      # Правило №14: «фикстура как у настоящей площадки». Два из трёх
      # последних инцидентов CalDAV (PR #491, PR #494) — один класс: парсер
      # внешнего формата (PROPFIND-ответ iCloud) тестировался на фикстуре,
      # которую выдумал сам автор кода, а не на том, что реально присылает
      # площадка. Гейт находит каждый парсер внешнего формата в src/** (явные
      # пути — caldav-*.ts, *init-data*.ts, auth/providers/*.ts,
      # channel/targets/*.ts — и content-эвристика: fetch(+разбор ответа или
      # проверка подписи/токена извне) и требует классификации в
      # scripts/recorded-fixtures-baseline.json: recorded — реально
      # записанная фикстура в test/fixtures/recorded/, которую спек читает
      # по имени, либо честный exempt (записи с площадки нет — долг, а не
      # нарушение). Флага --update нет: это классификация, не счётчик.
      - run: node scripts/check-recorded-fixtures.mjs
      # Правило №15: «гейт про гейты». Список исключений (ALLOW/EXCLUDE/
      # EXEMPT/EXCLUDED) внесли в храповик — а тест на то, что он гасит
      # именно законный случай и не шире, никто не написал: замер на каждый
      # существующий такой список в репозитории показал, что часть можно
      # было опустошить бесследно. Гейт требует у каждого непустого списка
      # тест, упоминающий его по имени (loadRegexList/loadStringList/
      # loadNamedPatterns или прямой импорт) в src/test-support/gates/.
      - run: node scripts/check-gate-exemptions.mjs
      # Индекс против .gitignore: отслеживаемый файл, который игнор запрещает
      # (правило не снимает уже отслеживаемое — так в репозитории жил
      # test/.jest-cache на 466 файлов). Нужны только git и node. Бейслайна
      # нет: нужный файл разрешается отрицанием `!путь` в самом .gitignore.
      - run: node scripts/check-ignored-tracked.mjs
      # Переезд на VPS (docs/MIGRATION_VPS.md): скрипты и compose-файлы
      # исполняются на сервере, до которого CI не дотягивается, поэтому
      # хотя бы разбираем их здесь. shellcheck стоит на ubuntu-latest;
      # `compose config` не требует демона, фиктивные значения — только чтобы
      # разобрать интерполяцию, секретов в них нет.
      - name: VPS-скрипты (shellcheck) и compose-файлы (config)
        run: |
          shellcheck deploy/transfer-db.sh deploy/vps/*.sh scripts/*.sh
          cd deploy/vps
          # shellcheck disable=SC2016  # `$` в значении — как у настоящего PROD_ENV
          printf 'FOO=a$b\n' > .env
          echo 'POSTGRES_PASSWORD=ci' > db.env
          export APP_IMAGE=registry.invalid/app:ci
          docker compose --env-file db.env -f docker-compose.yml config --quiet
          docker compose --env-file db.env -f docker-compose.yml -f docker-compose.transfer.yml config --quiet

  # Щит, волна 6: `docker build` реально собирает прод-образ. До этой джобы
  # ни одна не гоняла настоящую сборку — check-deploy-paths.mjs (джоба
  # `checks`, выше) статически сверяет ПУТИ за миллисекунды, но не исполняет
  # Dockerfile; синтаксис RUN-команд, версии npm-пакетов, доступность
  # deb.debian.org/реестра — всё это красило только сборку на Amvera, уже
  # после мержа, перед живыми пользователями. Джобы дополняют друг друга, а
  # не дублируют: без этой джобы push в main мог сломать сборку, и первым об
  # этом узнавал прод.
  #
  # docker/build-push-action с GitHub Actions cache (а не голый `docker
  # build`): у образа 20+ шагов (три npm ci, три сборки фронтендов) и без
  # кэша слоёв каждый прогон CI пересобирал бы всё с нуля — минуты впустую на
  # шагах, которые PR не менял. push:false — только собрать и проверить,
  # реестр не нужен (сам деплой делает Amvera по push в main, см. CLAUDE.md
  # «Деплой webapp»).
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          # FROM node:22-slim тянется через зеркало: Docker Hub отдавал 429 (2026-10-09).
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: schema-telegram-botnest:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Миграции гоняются на РЕАЛЬНОМ Postgres (инцидент 2026-07-16: битый сид
  # healthy_adult_phrases — updatedAt NOT NULL без значения — уронил прод
  # в крашлуп; ни один существующий чек SQL не исполнял). Правило CLAUDE.md
  # «Миграции БД»: рукописный SQL не мержится, пока не прошёл migrate deploy.
  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Docker Hub режет анонимные pull с общих IP раннеров (429, 2026-10-09):
        # тот же официальный образ через зеркало Google.
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: migrate deploy на пустой БД — ловит битые миграции до прода
        run: npx prisma migrate deploy
      - name: повторный migrate deploy — все миграции зарегистрированы, состояние чистое
        run: npx prisma migrate deploy
      # Джоба проверяла только что SQL исполняется, но не что миграции дают ту
      # же БД, что объявлена в schema.prisma. Из-за этого дрейф копился
      # незаметно: 4 индекса были в схеме, но их не создавала ни одна миграция —
      # на проде их просто не было, запросы шли последовательным сканом.
      # --exit-code: 0 = дифф пуст, 2 = есть расхождение → джоба падает.
      - name: schema.prisma == миграции — дрейф роняет PR, а не копится годами
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npx prisma generate
      # E2E read-after-write smoke на реальном Postgres (best-practice 2026-07):
      # сохранил карточку → читается обратно + попала в денормализованный
      # профиль. Только этот спек (app.e2e-spec поднимает весь AppModule и
      # требует полного env — здесь не нужен). --runInBand: одна БД, без гонок.
      - name: e2e read-after-write smoke
        run: npx jest --config ./test/jest-e2e.json --runInBand test/read-after-write.e2e-spec.ts
      # Leader-election кронов: вся защита от дублей на втором инстансе держится
      # на атомарности одного запроса, а атомарность — свойство Postgres, а не
      # нашего кода. На фейке этот спек ничего бы не доказывал, поэтому только тут.
      - name: e2e leader-election кронов на реальном Postgres
        run: npx jest --config ./test/jest-e2e.json --runInBand test/cron-leader.e2e-spec.ts
      # Полуночный обход, оборванный рестартом (аудит 2026-10): хвост доделывает
      # старт нового процесса, дублей нет — день человека забирает один UPDATE с
      # условием, а это свойство Postgres, не нашего кода.
      - name: e2e доделка полуночного обхода после рестарта на реальном Postgres
        run: npx jest --config ./test/jest-e2e.json --runInBand test/midnight-planner-resume.e2e-spec.ts
      # Ротация ENCRYPTION_KEY (аудит 2026-10-11, r2-0#0..#2; правило №18): по
      # строке на КАЖДУЮ запись списка ротации → rotateAll → читается новым ключом,
      # не читается старым; плюс отдельный процесс точки входа и его коды выхода.
      # Путь реагирования на утечку ключа обязан работать ДО того, как понадобится.
      - name: e2e ротация ENCRYPTION_KEY на реальном Postgres
        run: npx jest --config ./test/jest-e2e.json --runInBand test/key-rotation.e2e-spec.ts
      # Провал расшифровки (аудит 2026-10, D-8): Json-колонка с шифротекстом чужого
      # ключа читается как [] с маркером, а не base64-строкой — как драйвер Prisma 7
      # отдаёт такую колонку, знает только живая база; проба encryptionReadable
      # на тех же строках красная под чужим ключом и зелёная под своим.
      - name: e2e нечитаемые данные (маркер и проба) на реальном Postgres
        run: npx jest --config ./test/jest-e2e.json --runInBand test/encryption-readable.e2e-spec.ts
      # Аренда прогона бэкапа в R2 (deploy/backup-scheduler.cjs, аудит D-2): тот же
      # атомарный INSERT … ON CONFLICT, но через настоящий psql — драйвер и
      # квотирование :'переменных' проверяет только живая база. psql есть в образе
      # ubuntu-latest; на случай его отсутствия ставим клиент 16 явно.
      - name: e2e аренда бэкапа (psql) на реальном Postgres
        run: |
          command -v psql >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client-16
          npx jest --config ./test/jest-e2e.json --runInBand test/backup-lease.e2e-spec.ts
      # Инцидент 2026-09-13: запись на консультацию падала 500 на каждой попытке —
      # advisory-lock через $queryRaw, а Prisma 7 не читает колонку типа `void`.
      # Двенадцать юнит-спеков мокали $queryRaw и были зелёными. Свойство
      # драйвера доказывается только тут: сам лок + весь POST /api/booking/book.
      - name: e2e бронирование на реальном Postgres (advisory-lock + HTTP)
        run: npx jest --config ./test/jest-e2e.json --runInBand test/booking-slot-lock.e2e-spec.ts
      # Аудит 2026-10-11 (r2-1#2): слоты последнего дня окна раздавались свободными
      # при занятом времени — брони читались по сырому toDate. Фильтр по startsAt
      # делает СУБД, поэтому проверка сквозь HTTP — только на живой базе.
      - name: e2e слоты последнего дня окна на реальном Postgres
        run: npx jest --config ./test/jest-e2e.json --runInBand test/slot-last-day.e2e-spec.ts
      # PR B (.ics для клиента): POST /api/booking/book той же advisory-lock
      # дорогой, что и booking-slot-lock.e2e-spec.ts выше — фейковая Prisma
      # не эмулирует $executeRaw, поэтому тоже только тут.
      - name: e2e .ics для клиента на реальном Postgres
        run: npx jest --config ./test/jest-e2e.json --runInBand test/booking-ics.e2e-spec.ts
      # Аудит 2026-10-11, security#15: экран после оплаты не вправе говорить
      # «подтверждена» по SuccessURL без вебхука. Шов целиком: book →
      # /api/payment/success → by-token (HELD, paid=false) → вебхук → CONFIRMED.
      # book берёт advisory-lock через $executeRaw — фейковая Prisma не годится.
      - name: e2e экран после оплаты на реальном Postgres (success без вебхука)
        run: npx jest --config ./test/jest-e2e.json --runInBand test/booking-paid-page.e2e-spec.ts
      # Аудит 2026-10-11: бронь хранит сумму счёта (Booking.amount), а платная
      # сессия не бывает за 0. Шов целиком: book пишет колонку → админ меняет цену
      # → вебхук сверяется со счётом, а не с новой ценой; PATCH 0/1e22 → 400;
      # мусор в BookingSetting не становится ценой. book берёт advisory-lock через
      # $executeRaw — фейковая Prisma не годится.
      - name: e2e сумма счёта брони и цена платной сессии на реальном Postgres
        run: npx jest --config ./test/jest-e2e.json --runInBand test/booking-amount.e2e-spec.ts
      # L3 аудита 2026-07-20 (решение владельца 2026-10-08): крон стирает имя,
      # контакт и текст запроса у броней старше 12 месяцев. Запись plaintext ''
      # в шифрованную колонку и обратное чтение через драйвер и decryptRecord —
      # свойство Prisma, Postgres и crypto.ts, мок updateMany его не проверит;
      # плюс граница окна считается СУБД, а колонка anonymizedAt приезжает новой
      # миграцией (booking_pii_retention).
      - name: e2e обезличивание броней по сроку на реальном Postgres
        run: npx jest --config ./test/jest-e2e.json --runInBand test/booking-pii-retention.e2e-spec.ts
      # Глобальный аудит 2026-10-11: заявка с простой формы знакомства
      # (POST /api/booking) раньше жила только в DM и письме. Строка пишется в БД
      # до уведомлений; шифртекст, флаги доставки по каждому каналу, повтор
      # недоставленного и ретенция ('' в шифрованной колонке) доказываются только
      # настоящей базой и настоящим хостом визитки (правила №14, №18, №19).
      - name: e2e заявка с формы знакомства сохраняется до уведомлений на реальном Postgres
        run: npx jest --config ./test/jest-e2e.json --runInBand test/intro-lead.e2e-spec.ts
      # security#19 (аудит 2026-10): POST /api/booking/book с returning=true
      # отвечает клиенту и не-клиенту одинаково — ClientMeeting ищется по clientKey
      # в настоящей БД, поэтому на шве, а не на моке.
      - name: e2e запись не выдаёт, клиент ли контакт, на реальном Postgres
        run: npx jest --config ./test/jest-e2e.json --runInBand test/booking-returning-oracle.e2e-spec.ts
      # Аудит 2026-10: анонимная запись (INTRO_15, SESSION_50 вне рублей) отдавала
      # постоянную комнату клиента, найденную по контакту, — в ответе book, по
      # токену и в .ics. ClientMeeting ищется по clientKey в настоящей БД, бронь
      # берёт advisory-lock через $executeRaw — на шве, а не на моке (правило №18).
      - name: e2e анонимная запись не отдаёт ссылку на встречу на реальном Postgres
        run: npx jest --config ./test/jest-e2e.json --runInBand test/booking-meeting-link-leak.e2e-spec.ts
      # Аудит 2026-10: ключ комнаты клиента (ClientMeeting.clientKey) склеивал
      # разные ящики (`ivan-petrov@` ≡ `ivanpetrov@`) и был sha256 без секрета.
      # Шов — нормализация ↔ поиск строки в настоящей БД, перевод старых строк
      # меняет первичный ключ: уникальность проверяет только Postgres.
      - name: e2e ключ комнаты клиента не склеивает разные ящики на реальном Postgres
        run: npx jest --config ./test/jest-e2e.json --runInBand test/booking-client-key.e2e-spec.ts
      # Аудит 2026-10-11: прод без ROBOKASSA_* не подтверждает платную бронь и
      # донат без денег (503 до записи в БД) + проба «приходят ли вебхуки» на
      # настоящих запросах. «В БД ничего не появилось» доказывает только живая база.
      - name: e2e прод без Robokassa отказывает платным путям на реальном Postgres
        run: npx jest --config ./test/jest-e2e.json --runInBand test/payment-unconfigured-prod.e2e-spec.ts
      # Правило №18: каждый файл с сырым SQL исполняется на живом Postgres —
      # весь отчёт /stats (20 сервисов), /health, зонд аварии БД, VACUUM после
      # удаления аккаунта, захват списания подписки. Состав держит гейт
      # check-raw-sql-live.mjs (джоба checks). admin-stats — ядро /stats на
      # выборке больше 5000 пар «человек–день» (аудит 2026-10).
      - name: e2e сырой SQL на реальном Postgres (/stats и инфраструктура)
        run: >-
          npx jest --config ./test/jest-e2e.json --runInBand
          test/raw-sql-live-stats.e2e-spec.ts test/raw-sql-live-infra.e2e-spec.ts
          test/raw-sql-live-admin-stats.e2e-spec.ts
      # Аудит 2026-10: statement_timeout пула — параметр доходит до каждой
      # сессии, база отвечает 57014, ожидание замка входит в лимит, SET LOCAL
      # исключения не протекает в пул. Свойства драйвера, мок их не видит.
      - name: e2e таймаут запроса к БД на реальном Postgres
        run: npx jest --config ./test/jest-e2e.json --runInBand test/statement-timeout.e2e-spec.ts
      # Инцидент 2026-09-13: троттлинг денежных/заявочных ручек в Postgres —
      # атомарность ON CONFLICT DO UPDATE (правило №18) проверяется только тут.
      - name: e2e троттлинг на реальном Postgres (Postgres-хранилище + HTTP)
        run: npx jest --config ./test/jest-e2e.json --runInBand test/throttle-storage.e2e-spec.ts
      # Ownership-спеки ВТОРЫМ прогоном на реальном Postgres (TEST_TRUST_PLAN.md,
      # п.1): в джобе `backend` те же файлы гоняются на самописном fake-prisma
      # (test/e2e-support/fake-prisma.ts) — он трижды расходился с настоящей
      # Prisma на ЗЕЛЁНЫХ тестах (не понимал top-level OR → disconnect удалял
      # 0 строк, не применял @default из схемы → invite/join молча отбивался,
      # не поддерживал include → связь TherapyRelation→User была undefined).
      # Расхождение фейка с реальностью теперь падает здесь, а не живёт
      # годами незамеченным. E2E_REAL_DB=1 переключает buildTestApp() на
      # настоящий PrismaService (build-test-app.ts) вместо фейка.
      # --runInBand: одна БД, спеки чистят свои userId сами (cleanup-fixtures.ts).
      - name: e2e ownership smoke на реальном Postgres (фейк vs реальность)
        run: >-
          npx jest --config ./test/jest-e2e.json --runInBand
          test/app-ownership.e2e-spec.ts test/app-ownership-sweep.e2e-spec.ts
          test/app-ownership-sweep-2.e2e-spec.ts test/app-ownership-sweep-3.e2e-spec.ts
          test/therapy-ownership.e2e-spec.ts test/therapy-ownership-2.e2e-spec.ts test/therapy-web-client.e2e-spec.ts
          test/app-auth.e2e-spec.ts test/public-quizzes.e2e-spec.ts
          test/phrase-check-ownership.e2e-spec.ts
          test/login-ticket.e2e-spec.ts
          test/refresh-rotation.e2e-spec.ts
          test/notify-address.e2e-spec.ts
          test/merge-my-lists.e2e-spec.ts
          test/merge-relations.e2e-spec.ts
          test/merge-unique-rules.e2e-spec.ts
          test/account-export-ownership.e2e-spec.ts
          test/therapy-remove-client.e2e-spec.ts
          test/therapy-invite.e2e-spec.ts
          test/therapy-task-delete.e2e-spec.ts
          test/text-limits.e2e-spec.ts
          test/therapy-resign.e2e-spec.ts
          test/booking-admin-cancel.e2e-spec.ts
          test/exercise-delete-ownership.e2e-spec.ts
          test/max-auth.e2e-spec.ts
          test/diary-mode-from-case.e2e-spec.ts
        env:
          E2E_REAL_DB: '1'
      # Перенос БД на VPS (deploy/transfer-db.sh, docs/MIGRATION_VPS.md): настоящие
      # pg_dump и psql --single-transaction между двумя базами, отказ на
      # непустом приёмнике и «процесс не завершается» на старом хостинге. Мок
      # не заменит ни клиент, ни живую базу (правило №18).
      - name: e2e перенос БД на VPS на реальном Postgres
        run: |
          command -v pg_dump >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client-16
          npx jest --config ./test/jest-e2e.json --runInBand test/transfer-db.e2e-spec.ts
      # Откат образа поверх упавшей миграции (аудит 2026-10-11, infra#8): N+1 с
      # битой миграцией оставляет в _prisma_migrations запись, на которой образ N
      # падает с P3009. Настоящие prisma migrate deploy, prisma db execute и
      # deploy/entrypoint.mjs: recover-p3009.sql обязан снять запись, а образ N
      # поднять приложение. Мок не проверяет, что Prisma оставляет огрызок и что
      # DELETE его запись снимает (правило №18).
      - name: e2e откат образа поверх упавшей миграции на реальном Postgres
        run: |
          command -v psql >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client-16
          npx jest --config ./test/jest-e2e.json --runInBand test/migrate-stuck-record.e2e-spec.ts
      # План Б (docs/MIGRATION_VPS.md): настоящая цепочка backup-upload.sh →
      # (поддельный) S3 → backup-fetch-latest.sh → restore-backup.sh на живом
      # Postgres: восстановленная база обязана совпасть с источником.
      - name: e2e восстановление из бэкапа (S3) на реальном Postgres
        run: |
          command -v pg_dump >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client-16
          npx jest --config ./test/jest-e2e.json --runInBand test/restore-backup.e2e-spec.ts
      # Платёжный контур (TEST_TRUST_PLAN.md, п.1): идемпотентность вебхука —
      # повторное уведомление НЕ должно задвоить строку/списание — это вопрос
      # уникальных констрейнтов и транзакционных апдейтов, которые
      # fake-prisma.ts (generic in-memory `where`-матчер) не эмулирует —
      # фейк физически не может уронить тест на гонке/дублирующем INSERT.
      # cleanupPaymentFixtures (test/e2e-support/cleanup-fixtures.ts) чистит
      # фикстуры спека по фиксированным cancelToken/marker перед прогоном,
      # поэтому сам спек идемпотентен и локально гоняется на одной БД подряд
      # без ручной чистки между прогонами.
      - name: e2e payment webhook smoke на реальном Postgres (идемпотентность, хост визитки)
        run: >-
          npx jest --config ./test/jest-e2e.json --runInBand
          test/payment-webhooks.e2e-spec.ts
          test/payment-webhook-practice-host.e2e-spec.ts
        env:
          E2E_REAL_DB: '1'

  # Производительность — единственная зона, которую аудиты проверяли чтением
  # схемы, а не замером (docs/archive/PROJECT_AUDIT_ADDENDUM.md §3, находка D-4:
  # «первый кандидат в узкое место»; docs/security/AUDIT_2026-08-12.md, M2/M3/
  # H3/H4). Ни одного плана запроса никто не снимал. Разовый замер закрыл бы
  # вопрос один раз, а следующая просадка снова была бы невидимой — правило без
  # механизма не работает. Джоба сеет синтетику горизонта роста, прогоняет
  # горячие пути РЕАЛЬНЫМИ сервисами, снимает EXPLAIN (ANALYZE, BUFFERS) с того
  # SQL, который ушёл в базу через драйвер, и роняет PR на Seq Scan по большой
  # таблице с большим отбросом строк, на повторный полный проход и на кратный
  # рост числа страниц. Подробности и сам замер — docs/PERF_PLANS.md.
  #
  # Своя база, а не джоба `migrations`: там спеки /stats проверяют ПУСТОЕ
  # состояние отчёта (правило №8), а здесь в базе миллионы строк синтетики —
  # вместе они не живут.
  perf:
    runs-on: ubuntu-24.04
    # Сидер ~1 минута, замер ~1 минута; потолок — страховка от зависшего шага
    # (правило №24: шаг, который висит, а не падает, — тоже поломка).
    timeout-minutes: 15
    services:
      postgres:
        # Docker Hub режет анонимные pull с общих IP раннеров (429, 2026-10-09):
        # тот же официальный образ через зеркало Google.
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      # Синтетика «горизонт роста» (не ×10 от сегодняшних десятков юзеров: на
      # двух тысячах строк Postgres законно выбирает Seq Scan, и гейт краснел бы
      # на ПРАВИЛЬНЫХ планах). Данные детерминированы — иначе планка по
      # страницам шумела бы от прогона к прогону.
      - name: синтетика горизонта роста + ANALYZE
        run: npx ts-node --compiler-options '{"module":"commonjs"}' test/perf/seed.ts
      - name: EXPLAIN (ANALYZE, BUFFERS) по горячим путям
        run: npx ts-node --compiler-options '{"module":"commonjs"}' test/perf/run-plans.ts
      - run: node scripts/check-query-plans.mjs
      # После замера: шаги удаляют данные. Ночная чистка событий и удаление
      # самого тяжёлого аккаунта (с VACUUM) на объёме роста под прод-порогом
      # statement_timeout — запрос сверх порога роняет джобу.
      - name: долгие пути под прод-порогом statement_timeout
        run: npx ts-node --compiler-options '{"module":"commonjs"}' test/perf/long-paths.ts
      # Отчёт с планами — артефактом: по красной джобе должно быть видно, какой
      # именно запрос и какой план, не переспрашивая CI.
      - name: отчёт замера артефактом
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: query-plans
          path: .perf/plans.json
          if-no-files-found: warn

  webapp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci --prefix webapp
      # Без VITE_BOT_USERNAME production-сборка падает (shared/src/build/
      # requireBotUsername.ts); значение то же, что в Dockerfile — их равенство
      # держит bot-username-sources.spec.ts.
      - run: npm run build --prefix webapp
        env:
          VITE_BOT_USERNAME: SchemeHappensBot
      # Байт-храповик размера бандлов (аудит 2026-07, пункт №5): сборка выше
      # печатает «chunks larger than 400 kB» и это молча игнорировалось —
      # гейт меряет байты webapp/dist (свежесобран шагом выше) и уже
      # закоммиченного schema-miniapp/dist (checkout принёс его вместе с
      # репозиторием — джоба не собирает мини-апп отдельно). Шаг стоит СРАЗУ
      # после сборки: гейту нужен готовый webapp/dist, иначе он падает с
      # понятной подсказкой «сначала собери».
      - run: node scripts/check-bundle-size-ratchet.mjs
      # Фронтенд-coverage-храповик (TEST_IMPROVEMENT_PLAN.md, этап 2.1; по
      # образцу scripts/check-coverage-ratchet.mjs бэкенда): сам гоняет
      # `vitest run --coverage` и падает при просадке покрытия ниже
      # scripts/frontend-coverage-baseline.json. Раньше coverage тут вообще
      # не гейтился — джоба просто гоняла `npm test`.
      - run: node scripts/check-frontend-coverage-ratchet.mjs --package webapp
      # Второй прогон под НЕ-UTC зоной — см. комментарий в джобе shared
      # (инцидент 2026-09-17). Раньше такой прогон был только у бэкендового
      # jest, поэтому TZ-зависимый код фронтендов CI не проверял вообще.
      - name: vitest под не-UTC таймзоной
        run: npm test --prefix webapp
        env:
          TZ: Australia/Sydney
      # ты/вы-храповик (правило CLAUDE.md): новые жёсткие «ты»-строки без tr()
      # не проходят; исторический долг зафиксирован в бейслайне.
      - run: node scripts/check-address-form.mjs
      # Согласование «вы» (свип голоса 2026-07): храповик выше ищет остаточные
      # «ты»-местоимения и слеп к паре «вы» + единственное число — «вы дал»,
      # «вы благодарен», «вы вырос». Сплошная вычитка нашла 11 таких мест;
      # проверка жёсткая, без бейслайна — новых быть не должно.
      - run: node scripts/check-address-agreement.mjs
      # Обращение вне механики форм (свип 2026-08): храповик выше ловит только
      # захардкоженные «ты»-МЕСТОИМЕНИЯ во фронтендах — этот заодно ловит
      # императивы («Нажми») без местоимения рядом, зеркальные «вы»-формы и
      # бэкенд (`src/`, письма/уведомления). Пофайловый бейслайн.
      - run: node scripts/check-second-person.mjs
      # Храповик подпороговых fontSize (дизайн-аудит 2026-08, В1): inline
      # `fontSize: N` ниже 11px — нижний читаемый порог. fs-only, тот же
      # принцип, что у check-second-person.mjs выше.
      - run: node scripts/check-tiny-fonts.mjs
      # Драйв-гард парных файлов (правило №3): канонические пары
      # webapp ↔ miniapp обязаны быть побайтово идентичны.
      - run: node scripts/check-paired-files.mjs
      # Контракт дизайн-токенов (дизайн-аудит 2026-08, В11): оба index.css
      # обязаны импортировать shared/src/theme/tokens.css (акцент+шрифты) и
      # объявлять одни и те же имена для токенов, чьё значение намеренно
      # локально (статусные цвета, поверхности).
      - run: node scripts/check-token-contract.mjs
      # Храповик значений вне шкалы (дизайн-аудит 2026-08, В11, волна
      # «порядок»): без гейта шкала --r-*/--space-* в tokens.css — просто
      # комментарий, который следующий PR не обязан соблюдать. fs-only,
      # тот же принцип, что у check-tiny-fonts.mjs выше.
      - run: node scripts/check-scale-drift.mjs
      # Храповик размытия (расследование скорости 2026-08-26): backdrop-filter
      # и filter: blur считаются программно в установленном на телефон PWA —
      # ~1.4с на кадр, приложение вязнет. fs-only, тот же принцип, что у
      # check-tiny-fonts.mjs выше.
      - run: node scripts/check-render-poison.mjs
      # Храповик цветовых литералов (PR #516: ~40 хардкод-цветов переведены
      # на токены/color-mix, но без механизма следующий PR написал бы
      # rgba(239,68,68,0.08) заново). fs-only, тот же принцип, что у
      # check-tiny-fonts.mjs выше.
      - run: node scripts/check-color-drift.mjs
      # Hex-суффикс альфы к var() (PR #520: `var(--c-rose)18` невалиден «на
      # этапе вычисления», браузер берёт НАЧАЛЬНОЕ значение свойства — без
      # ошибки в консоли). Абсолютный, без бейслайна: #520 вычистил класс
      # полностью, замораживать нечему. Смотрит и в .css.
      - run: node scripts/check-var-alpha-suffix.mjs
      # Спрятанное через opacity: 0 и раскрываемое только по :hover (находка
      # аудита 2026-10: кнопка удаления доказательства на телефоне). Нужны
      # два пути без hover: для пальца @media (hover: none), для клавиатуры
      # :focus-within; класс состояния закрывает оба. Абсолютный, без бейслайна.
      - run: node scripts/check-hover-only-reveal.mjs
      # Храповик мелких тап-целей (дизайн-аудит 2026-08, К3): правило «цель
      # ≥ 44×44» из CLAUDE.md чинили в #397 без гейта, и класс вернулся.
      # Считает квадратные интерактивные элементы с inline width И height
      # меньше 44 мимо `hitboxStyle`; промах по одной стороне не считается.
      # fs-only, тот же принцип, что у check-tiny-fonts.mjs выше.
      - run: node scripts/check-tap-targets.mjs
      # Контрол без имени из одного глифа (аудит 2026-10, «Доступность»):
      # `<button>←</button>`, пустой `{...pressable(f)}`-тик, кнопка с одной
      # иконкой — скринридер читает «стрелка влево» или просто «кнопка».
      # jsx-a11y/control-has-associated-label глиф считает подписью, а роль из
      # спреда pressable() не видит — эту половину держит гейт. AST через
      # typescript из webapp/node_modules. Абсолютный, без бейслайна;
      # webapp/src и shared/src, мини-апп не покрыт (ONE_FRONTEND_PLAN.md).
      - run: node scripts/check-glyph-controls.mjs
      # Оверлей на весь экран обязан жить в истории браузера (находка аудита
      # 2026-10: чек-ин в ModesTab закрывал справочник целиком). `.tsx` с
      # position: fixed + inset: 0 — инлайном или через CSS-класс — вызывает
      # useHistorySheet либо стоит в scripts/history-sheet-baseline.json с
      # причиной. Классификация, флага --update нет; мини-апп не покрыт.
      - run: node scripts/check-history-sheet.mjs
      # Вебвизор визитки (аудит 2026-10, security#27): политика обещает «поля
      # ввода не записываются», а Вебвизор пишет клавиши везде, кроме полей с
      # ym-disable-keys. Текстовое поле на странице из personalRoutes без метки
      # красит CI. Абсолютный, без бейслайна. Секреты в DOM (ссылка встречи,
      # токен в href) держит webvisorSecrets.test.tsx в vitest этой же джобы.
      - run: node scripts/check-webvisor-fields.mjs
      # Код webapp исполняется в браузере пользователя: high/critical в его
      # prod-зависимостях блокирует мерж (см. шаг audit в джобе backend).
      # Последним, чтобы красный audit не прятал сигнал тестов.
      - name: npm audit — webapp
        timeout-minutes: 4
        run: node scripts/npm-audit.mjs webapp

  # shared/ — общий пакет двух фронтендов (этап 2.2 TEST_IMPROVEMENT_PLAN.md):
  # до этой джобы 3431 строка shared-кода тестировалась только транзитивно
  # через тесты webapp/miniapp — свои тесты и свой coverage-храповик не
  # существовали. Джоба гоняет vitest пакета через тот же
  # check-frontend-coverage-ratchet.mjs (--package shared).
  shared:
    runs-on: ubuntu-24.04
    # 13, а не 10: тесты с покрытием и вторая зона идут до ~8,5 мин, плюс
    # худший случай audit-обёртки (2 мин 41 с) в конце джобы.
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - run: npm ci --prefix shared
      - run: node scripts/check-frontend-coverage-ratchet.mjs --package shared
      # Тот же пакет под НЕ-UTC зоной, по образцу второго прогона jest в
      # джобе backend (инцидент 2026-07-20). Инцидент 2026-09-17 показал, что
      # у фронтендов и shared такого прогона не было: календарный день
      # `YYYY-MM-DD` разбирался как полночь ЗОНЫ МАШИНЫ, запись выпадала из
      # недельной выборки «Моего пути» на UTC+3 — и CI (раннер всегда UTC)
      # оставался зелёным. Поломку нашёл владелец, а не проверка (правило №14:
      # зелёный CI не значит «у пользователей работает»).
      # Sydney — та же зона, что у бэкенда: ненулевое смещение и DST в
      # противофазе к северному полушарию.
      - name: vitest под не-UTC таймзоной — ловит зависимость от зоны машины
        run: npm test --prefix shared
        env:
          TZ: Australia/Sydney
      # См. шаг audit в джобе backend.
      - name: npm audit — shared
        timeout-minutes: 4
        run: node scripts/npm-audit.mjs shared

  # eslint-храповик (этап 2е, правило №9). Нужны node_modules всех трёх
  # пакетов + prisma generate: typed-линт без типов зависимостей видит
  # everything-as-any и счётчики уезжают. game/ исключён (заморожен).
  eslint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json
            schema-miniapp/package-lock.json
            shared/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm ci --prefix webapp
      - run: npm ci --prefix schema-miniapp
      # shared тоже линтуется храповиком, а зависимости ему не ставили —
      # правила, зависящие от типов (no-unnecessary-type-assertion и родня),
      # без node_modules разрешают TS иначе, чем локально. Итог: файл
      # shared/ проходил локальный прогон и краснел в CI (реальный случай
      # 2026-08 — лишний каст в useConfetti.test.tsx). Разные вердикты у
      # одного гейта хуже, чем строгий гейт: локальной проверке перестают
      # верить.
      - run: npm ci --prefix shared
      - run: node scripts/check-eslint-ratchet.mjs

  miniapp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: schema-miniapp/package-lock.json
      - run: npm ci --prefix schema-miniapp
      # build мини-аппа — голый `vite build` (без tsc, чтобы пересборка dist
      # оставалась быстрой). Типы гоняем отдельным шагом через
      # tsconfig.typecheck.json — иначе TS-ошибки в исходнике мини-аппа
      # доезжают до прода (webapp имеет гейт через `tsc -b`).
      - run: npm run typecheck --prefix schema-miniapp
      - run: npm run build --prefix schema-miniapp
      # Фронтенд-coverage-храповик (TEST_IMPROVEMENT_PLAN.md, этап 2.1) —
      # см. комментарий в джобе webapp; здесь гоняет только свой пакет.
      - run: node scripts/check-frontend-coverage-ratchet.mjs --package schema-miniapp
      # Второй прогон под НЕ-UTC зоной — см. комментарий в джобе shared
      # (инцидент 2026-09-17).
      - name: vitest под не-UTC таймзоной
        run: npm test --prefix schema-miniapp
        env:
          TZ: Australia/Sydney
      # dist коммитится в git (Docker его только копирует) — проверяем,
      # что закоммиченный dist не разошёлся с исходником.
      - name: dist актуален
        run: |
          if [ -n "$(git status --porcelain schema-miniapp/dist)" ]; then
            echo '::error::schema-miniapp/dist устарел — пересобери: npm run build --prefix schema-miniapp и закоммить dist'
            git status --short schema-miniapp/dist
            exit 1
          fi
      # См. шаг audit в джобе backend.
      - name: npm audit — schema-miniapp
        timeout-minutes: 4
        run: node scripts/npm-audit.mjs schema-miniapp
