<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Что даёт мессенджер — зонд</title>
    <!--
      Диагностическая страница: подключается как мини-приложение в мессенджере
      (MAX, Telegram) и показывает, что его вебвью реально отдаёт приложению —
      какой глобальный объект, какие методы, где лежит подпись входа.
      Нужна потому, что документацию площадки читать неудобно, а адаптер хоста
      (shared/src/host) надо писать под факт: имена полей, а не догадки.

      ЗНАЧЕНИЯ МАСКИРУЮТСЯ. Подпись входа — рабочий пропуск на время её
      жизни, поэтому наружу идут только имена полей, типы и длины: этого
      хватает, чтобы написать адаптер, и не хватает, чтобы кем-то войти.
    -->
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        margin: 0;
        padding: max(16px, env(safe-area-inset-top)) 16px
                 max(16px, env(safe-area-inset-bottom));
        background: #10131a;
        color: #e6e8ee;
        font-size: 13px;
        line-height: 1.5;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p.sub { margin: 0 0 16px; color: #8b93a7; font-size: 12px; }
      section { margin-bottom: 14px; }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #7aa2f7;
        margin: 0 0 6px;
      }
      pre {
        margin: 0;
        padding: 10px;
        background: #171b26;
        border-radius: 8px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      button {
        width: 100%;
        padding: 14px;
        margin-top: 8px;
        border: none;
        border-radius: 10px;
        background: #7aa2f7;
        color: #10131a;
        font: inherit;
        font-weight: 600;
      }
      textarea {
        display: none;
        width: 100%;
        margin-top: 8px;
        padding: 10px;
        box-sizing: border-box;
        border: none;
        border-radius: 8px;
        background: #171b26;
        color: #e6e8ee;
        font: inherit;
      }
      .ok { color: #9ece6a; }
      .no { color: #f7768e; }
    </style>
  </head>
  <body>
    <h1>Зонд: что даёт этот мессенджер</h1>
    <p class="sub">
      Значения скрыты — видны только имена полей, типы и длины. Нажми кнопку
      внизу, чтобы скопировать этот отчёт текстом.
    </p>
    <div id="out">Собираю…</div>
    <button id="copy" type="button">Скопировать отчёт</button>
    <textarea id="dump" readonly rows="14"></textarea>

    <script src="/max-probe.js"></script>
  </body>
</html>
